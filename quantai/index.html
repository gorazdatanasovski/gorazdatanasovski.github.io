<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QuantAI</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-top">
      <a class="sidebar-item" href="./" title="New chat">
        <span class="sidebar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="sidebar-label">New chat</span>
      </a>
      <button class="sidebar-item sidebar-button" type="button" title="Search chats">
        <span class="sidebar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.8"/>
            <path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="sidebar-label">Search chats</span>
      </button>
      <button class="sidebar-item sidebar-button" type="button" title="Projects">
        <span class="sidebar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4.5 7.5a2 2 0 0 1 2-2h4l1.5 1.8h5.5a2 2 0 0 1 2 2v6.2a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="sidebar-label">Projects</span>
      </button>
      <button class="sidebar-item sidebar-button" type="button" title="More">
        <span class="sidebar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="6" cy="12" r="1.7"/>
            <circle cx="12" cy="12" r="1.7"/>
            <circle cx="18" cy="12" r="1.7"/>
          </svg>
        </span>
        <span class="sidebar-label">More</span>
      </button>
      <div class="sidebar-section-label">Recents</div>
    </div>
    <div class="sidebar-bottom">
      <button class="sidebar-item sidebar-button sidebar-account" type="button" title="Account">
        <span class="sidebar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.7"/>
            <path d="M5.5 19c1.4-3.1 4-4.7 6.5-4.7S17.1 15.9 18.5 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="sidebar-label">Account</span>
      </button>
    </div>
  </div>
</aside>
<header class="topbar">
  <a class="brand" href="./" title="Refresh QuantAI">QuantAI</a>
  <div class="top-actions">
    <button class="top-action" id="shareButton" type="button" title="Share">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 16V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M8 9l4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 18.5h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="top-action" id="menuButton" type="button" title="More">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <circle cx="6" cy="12" r="1.75"/>
        <circle cx="12" cy="12" r="1.75"/>
        <circle cx="18" cy="12" r="1.75"/>
      </svg>
    </button>
  </div>
</header>
<main class="app-shell" id="appShell">
  <section class="hero" id="hero">
    <h1 class="headline">What are you working on?</h1>
    <div class="composer-wrap composer-wrap-top" id="composerWrapTop">
      <form id="composerTop" class="composer" autocomplete="off">
        <div class="mode-cluster">
          <button class="mode-button" id="modeButtonTop" type="button" aria-label="Choose mode">
            <span id="modeLabelTop">Auto</span>
            <span class="mode-chevron">▾</span>
          </button>
          <div id="modeMenuTop" class="mode-menu hidden">
            <button type="button" data-mode="auto">Auto</button>
            <button type="button" data-mode="evidence">Evidence</button>
            <button type="button" data-mode="theorem">Theorem</button>
            <button type="button" data-mode="options_surface_memory">Surface</button>
            <button type="button" data-mode="market_memory">Memory</button>
            <button type="button" data-mode="market_live_snapshot">Live</button>
            <button type="button" data-mode="market_calibration">Calibration</button>
          </div>
        </div>
        <textarea id="promptTop" class="prompt-input" rows="1" placeholder="Ask anything" aria-label="Ask anything"></textarea>
        <button class="send-button" id="sendTop" type="submit" aria-label="Send">↑</button>
      </form>
    </div>
    <div class="site-note site-note-top">© Gorazd Atanasovski 2026</div>
  </section>
  <section class="messages" id="messages"></section>
  <div class="composer-wrap composer-wrap-bottom" id="composerWrapBottom">
    <form id="composerBottom" class="composer" autocomplete="off">
      <div class="mode-cluster">
        <button class="mode-button" id="modeButtonBottom" type="button" aria-label="Choose mode">
          <span id="modeLabelBottom">Auto</span>
          <span class="mode-chevron">▾</span>
        </button>
        <div id="modeMenuBottom" class="mode-menu hidden">
          <button type="button" data-mode="auto">Auto</button>
          <button type="button" data-mode="evidence">Evidence</button>
          <button type="button" data-mode="theorem">Theorem</button>
          <button type="button" data-mode="options_surface_memory">Surface</button>
          <button type="button" data-mode="market_memory">Memory</button>
          <button type="button" data-mode="market_live_snapshot">Live</button>
          <button type="button" data-mode="market_calibration">Calibration</button>
        </div>
      </div>
      <textarea id="promptBottom" class="prompt-input" rows="1" placeholder="Ask anything" aria-label="Ask anything"></textarea>
      <button class="send-button" id="sendBottom" type="submit" aria-label="Send">↑</button>
    </form>
  </div>
  <div class="site-note site-note-bottom">© Gorazd Atanasovski 2026</div>
</main>
<div class="toast" id="toast"></div>
<div class="launch-overlay hidden" id="launchOverlay" aria-hidden="true">
  <div class="launch-backdrop"></div>
  <div class="launch-modal" role="dialog" aria-modal="true" aria-labelledby="launchTitle">
    <div class="launch-badge">Publication Notice</div>
    <div class="launch-overline">Free model</div>
    <h2 class="launch-title" id="launchTitle">ATAX-1 1.0</h2>
    <p class="launch-copy">Releases June 30.</p>
    <a class="launch-home" href="../">Home</a>
  </div>
</div>
<template id="userMessageTemplate">
  <article class="message message-user">
    <div class="message-user-bubble"></div>
  </article>
</template>
<template id="assistantMessageTemplate">
  <article class="message message-assistant">
    <div class="message-assistant-text"></div>
    <details class="details hidden">
      <summary>Sources</summary>
      <div class="details-body"></div>
    </details>
  </article>
</template>
<script src="./app.js"></script>
</body>
</html>
